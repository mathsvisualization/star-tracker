[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "telegram-stars-tracker"
version = "0.0.3"
description = "A Python application for tracking Telegram Stars earnings, withdrawals, and payment maturity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = []


[project.optional-dependencies]
test = [
    "pytest>=8",
]


[project.scripts]
star-tracker = "main:main"


[project.urls]
Repository = "https://github.com/mathsvisualization/telegram-stars-tracker"
Issues = "https://github.com/mathsvisualization/telegram-stars-tracker/issues"


[tool.setuptools]
py-modules = ["main", "config"]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "storage*",
    "reports*",
    "ui*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
