name: Bug Report
description: Report an error or unexpected behaviour.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide enough information to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
      placeholder: Explain the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run the application
        2. Select an option
        3. Enter some data
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the complete traceback, if available.
      render: shell

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. Python 3.12"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, Android/Termux"

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I checked that this issue has not already been reported.
          required: true
        - label: I have removed personal and sensitive information from logs.
          required: true
